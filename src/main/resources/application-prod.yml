# =============================================================================
# Speed WMS — Spring Boot Production Profile
# 激活方式：通过环境变量 SPRING_PROFILES_ACTIVE=prod
# 此文件覆盖 application.yml 中的同名配置项
#
# ⚠️  所有敏感值均从环境变量注入，此文件本身不含任何密钥
# =============================================================================

spring:
  # 生产环境强制关闭 data.sql 自动初始化（数据由 Flyway/Liquibase 或手动迁移管理）
  sql:
    init:
      mode: never

  # 数据源（由 docker-compose --env-file .env.prod 注入）
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # 生产环境连接池调优
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Redis（由 docker-compose --env-file .env.prod 注入）
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:wms-redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD}

# 生产日志级别（降低调试输出，减少日志存储成本）
logging:
  level:
    com.wms.wmsbackend: INFO
    org.springframework.security: WARN
    org.springframework.security.web.authentication: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 生产环境 AI 预测引擎（使用容器内服务名）
ai:
  prediction-engine:
    base-url: http://wms-prediction:8000
    timeout-ms: 5000
    enabled: true

# Spring Boot Actuator（仅暴露 health 端点供 docker healthcheck 使用）
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
