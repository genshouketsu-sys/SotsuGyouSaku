server:
  address: 0.0.0.0

spring:
  profiles:
    # 默认激活 dev profile；生产环境通过 SPRING_PROFILES_ACTIVE=prod 覆盖
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Datasource 基础配置（dev/prod profile 中会覆盖连接池等详细参数）
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/wms_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Redis 基础配置
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  jackson:
    # LocalDateTime を ISO-8601 文字列として出力 / LocalDateTime 以 ISO-8601 字符串输出
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Tokyo

mybatis:
  configuration:
    map-underscore-to-camel-case: true

# JWT 署名密钥 / JWT 签名密钥
# ⚠️  [SEC] 必须通过环境变量 JWT_SECRET 注入，严禁在此处设置真实密钥
jwt:
  secret: ${JWT_SECRET}

# Yahoo! Shopping API App ID（未設定の場合は外部検索をスキップ）
# yahoo:
#   appid: ${YAHOO_APP_ID}