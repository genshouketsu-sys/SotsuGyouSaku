server:
  address: 0.0.0.0

spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/wms_db
    username: postgres
    # パスワードは環境変数 DB_PASSWORD で設定することを推奨 / 推荐通过环境变量 DB_PASSWORD 配置
    # ローカル PostgreSQL 開発環境: インストール時に設定したパスワード
    password: "postgres"
  sql:
    init:
      mode: always
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  jackson:
    # LocalDateTime を配列ではなく ISO-8601 文字列として出力する
    # LocalDateTime 以 ISO-8601 字符串输出，而非数组
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Tokyo

mybatis:
  configuration:
    map-underscore-to-camel-case: true

# JWT 署名秘密鍵（本番環境では必ず変更すること）/ JWT 签名密钥（生产环境中必须修改）
jwt:
  secret: OmniWmsPredictiveLogisticsSuperSecretKey2024!

# Yahoo! Shopping API App ID（未設定の場合は外部検索をスキップ）/ 未设置时跳过外部查询
# yahoo:
#   appid: YOUR_APP_ID_HERE

logging:
  level:
    com.wms.wmsbackend: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.web.authentication: TRACE

# --- AI 予測エンジン設定 / AI Prediction Engine Config ---
ai:
  prediction-engine:
    base-url: http://127.0.0.1:8000
    timeout-ms: 5000
    enabled: true

