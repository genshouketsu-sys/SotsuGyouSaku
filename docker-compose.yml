# =============================================================================
# Speed WMS - Docker Compose 生产环境编排文件
# 服务：PostgreSQL + Redis + Spring Boot Backend + Python Prediction Engine + React Frontend
# 使用方法：将此文件与 .env.prod 放在项目根目录，执行 docker compose up -d
# =============================================================================

version: "3.9"

# ─────────────────────────────────────────────────────────────
# 自定义网络：所有服务在同一内部网络中通过服务名相互访问
# ─────────────────────────────────────────────────────────────
networks:
  wms-network:
    driver: bridge

# ─────────────────────────────────────────────────────────────
# 持久化存储卷（数据库数据不随容器删除而丢失）
# ─────────────────────────────────────────────────────────────
volumes:
  postgres-data:
  redis-data:

services:

  # ───────────────────────────────────────────────
  # [1] PostgreSQL 数据库
  # ───────────────────────────────────────────────
  wms-postgres:
    image: postgres:16-alpine
    container_name: wms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wms_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - wms-network
    ports:
      - "5432:5432"   # 如无需从宿主机直接访问数据库，可删除此行
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d wms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ───────────────────────────────────────────────
  # [2] Redis 缓存（幂等键 / WebSocket 会话）
  # ───────────────────────────────────────────────
  wms-redis:
    image: redis:7-alpine
    container_name: wms-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - wms-network
    ports:
      - "6379:6379"   # 如无需从宿主机访问 Redis，可删除
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ───────────────────────────────────────────────
  # [3] Spring Boot 后端 API
  # ───────────────────────────────────────────────
  wms-backend:
    build:
      context: .                          # 构建上下文：项目根目录
      dockerfile: Dockerfile.backend      # 指定后端 Dockerfile
    image: speed-wms/backend:latest
    container_name: wms-backend
    restart: unless-stopped
    depends_on:
      wms-postgres:
        condition: service_healthy        # 等待 PostgreSQL 健康检查通过
      wms-redis:
        condition: service_healthy        # 等待 Redis 健康检查通过
    environment:
      # Spring Boot 数据源配置
      SPRING_DATASOURCE_URL: jdbc:postgresql://wms-postgres:5432/wms_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Redis 配置
      SPRING_DATA_REDIS_HOST: wms-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # JWT 密钥（必须从环境变量注入，禁止硬编码）
      JWT_SECRET: ${JWT_SECRET}
      # Spring 运行环境
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    networks:
      - wms-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s   # Spring Boot 启动时间较长

  # ───────────────────────────────────────────────
  # [4] Python FastAPI 预测引擎
  # ───────────────────────────────────────────────
  wms-prediction:
    build:
      context: ./prediction-engine        # 构建上下文：prediction-engine 目录
      dockerfile: Dockerfile.prediction
    image: speed-wms/prediction:latest
    container_name: wms-prediction
    restart: unless-stopped
    depends_on:
      wms-postgres:
        condition: service_healthy
    environment:
      WMS_DB_HOST: wms-postgres           # 使用服务名访问数据库
      WMS_DB_PORT: 5432
      WMS_DB_NAME: wms_db
      WMS_DB_USER: ${POSTGRES_USER}
      WMS_DB_PASSWORD: ${POSTGRES_PASSWORD}
      ENGINE_PORT: 8000
    ports:
      - "8000:8000"
    networks:
      - wms-network

  # ───────────────────────────────────────────────
  # [5] React/Vite 前端（Nginx 静态服务）
  # ───────────────────────────────────────────────
  wms-frontend:
    build:
      context: ./wms-frontend             # 构建上下文：wms-frontend 目录
      dockerfile: Dockerfile.frontend
    image: speed-wms/frontend:latest
    container_name: wms-frontend
    restart: unless-stopped
    depends_on:
      - wms-backend
    ports:
      - "80:80"                           # 对外暴露 HTTP 80 端口
    networks:
      - wms-network
